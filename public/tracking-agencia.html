<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguimiento de Trámite | Agencia Aduanal HoyMismo</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Lucide Icons via CDN -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- QR Code Generator -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                        },
                        accent: {
                            400: '#a78bfa',
                            500: '#8b5cf6',
                            600: '#7c3aed',
                        }
                    },
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.5rem;
        }
        .animated-background {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            z-index: -1;
            background: linear-gradient(135deg, #0f172a, #1e3a8a, #3730a3, #0f172a);
            background-size: 400% 400%;
            animation: gradient-flow 15s ease infinite;
        }
        @keyframes gradient-flow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .fade-in-up { animation: fadeInUp 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; opacity: 0; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .timeline-track::before {
            content: ''; position: absolute; top: 1.25rem; left: 0; right: 0;
            height: 2px; background-color: rgba(255, 255, 255, 0.1); z-index: 0;
        }
        .timeline-progress {
            position: absolute; top: 1.25rem; left: 0;
            height: 2px; background: linear-gradient(90deg, #3b82f6, #8b5cf6); z-index: 1;
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .timeline-step.completed .step-circle { background-color: #10b981; border-color: #10b981; }
        .timeline-step.completed .step-circle i { color: #fff; }
        .timeline-step.active .step-circle { background-color: #8b5cf6; border-color: #8b5cf6; animation: pulse 2s infinite; }
        .timeline-step.active .step-circle i { color: #fff; }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.4); }
            50% { box-shadow: 0 0 0 8px rgba(139, 92, 246, 0); }
        }
        .gemini-spinner {
            width: 28px; height: 28px;
            border: 3px solid rgba(167, 139, 250, 0.3);
            border-top-color: #a78bfa;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Modal styles */
        .modal-overlay {
            backdrop-filter: blur(8px);
            animation: fadeIn 0.3s ease;
        }
        @keyframes modalFadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .modal-content { animation: modalFadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="text-slate-200">
    <div class="animated-background"></div>

    <div class="container mx-auto max-w-5xl p-4 md:p-8 min-h-screen flex flex-col">
        <header class="text-center my-8 md:my-12 fade-in-up" style="animation-delay: 0.1s;">
            <div class="inline-flex items-center justify-center gap-3 mb-4">
                <div class="w-14 h-14 bg-primary-500/20 rounded-2xl flex items-center justify-center ring-2 ring-primary-500/30">
                    <i data-lucide="car" class="w-8 h-8 text-primary-400"></i>
                </div>
            </div>
            <h1 class="text-4xl md:text-5xl font-extrabold text-white tracking-tighter">
                Seguimiento de <span class="text-transparent bg-clip-text bg-gradient-to-r from-primary-400 to-accent-500">Trámite</span>
            </h1>
            <p class="mt-4 text-lg md:text-xl text-slate-400 max-w-3xl mx-auto">
                Consulta el estado de tu trámite de importación vehicular en tiempo real
            </p>
        </header>

        <main class="flex-grow">
            <!-- Búsqueda -->
            <section id="search-section" class="glass-card p-6 md:p-8 fade-in-up" style="animation-delay: 0.3s;">
                <div class="max-w-xl mx-auto">
                    <!-- Tabs de búsqueda -->
                    <div class="flex gap-2 mb-4">
                        <button id="tab-email" onclick="setSearchMode('email')" class="flex-1 px-4 py-2 bg-primary-500 text-white rounded-lg font-semibold transition-all">
                            <i data-lucide="mail" class="w-4 h-4 inline mr-2"></i>Correo
                        </button>
                        <button id="tab-folio" onclick="setSearchMode('folio')" class="flex-1 px-4 py-2 bg-slate-700 text-slate-300 rounded-lg font-semibold transition-all hover:bg-slate-600">
                            <i data-lucide="file-text" class="w-4 h-4 inline mr-2"></i>Folio
                        </button>
                        <button id="tab-vin" onclick="setSearchMode('vin')" class="flex-1 px-4 py-2 bg-slate-700 text-slate-300 rounded-lg font-semibold transition-all hover:bg-slate-600">
                            <i data-lucide="car" class="w-4 h-4 inline mr-2"></i>VIN
                        </button>
                    </div>

                    <!-- Campo de búsqueda -->
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i id="search-icon" data-lucide="mail" class="w-5 h-5 text-slate-400"></i>
                        </div>
                        <input type="text" id="search-input"
                            class="w-full pl-12 pr-4 py-3.5 text-lg text-white bg-slate-900/50 border-2 border-white/10 rounded-xl focus:ring-4 focus:ring-primary-500/30 focus:border-primary-500 outline-none transition-all duration-300 placeholder:text-slate-500"
                            placeholder="Ingresa tu correo electrónico...">
                    </div>

                    <div class="flex flex-col sm:flex-row gap-4 mt-4">
                        <button id="search-btn" onclick="handleSearch()" class="w-full bg-gradient-to-r from-primary-500 to-accent-500 hover:from-primary-600 hover:to-accent-600 text-white font-bold py-3.5 px-8 rounded-xl flex items-center justify-center gap-2 transition-all duration-300 transform hover:scale-[1.02] focus:ring-4 focus:ring-primary-400/50 shadow-lg shadow-primary-500/20">
                            <i data-lucide="search" class="w-5 h-5"></i>
                            <span>Consultar Trámite</span>
                        </button>
                        <button id="clear-btn" onclick="resetUI()" class="w-full sm:w-auto bg-slate-700 hover:bg-slate-600 text-slate-300 font-bold py-3.5 px-6 rounded-xl flex items-center justify-center gap-2 transition-all duration-300">
                            <i data-lucide="x" class="w-5 h-5"></i>
                            <span>Limpiar</span>
                        </button>
                    </div>
                </div>
            </section>

            <!-- Mensajes de estado -->
            <div id="status-container" class="mt-8"></div>

            <!-- Resultados -->
            <div id="results-view" class="hidden mt-8 space-y-6"></div>
        </main>

        <footer class="text-center text-slate-500 py-8">
            <p>&copy; 2026 <a href="https://agenciaaduanalhoymismo.com" class="font-semibold text-slate-400 hover:text-white transition">Agencia Aduanal HoyMismo</a>. Todos los derechos reservados.</p>
        </footer>
    </div>

    <!-- Modal Compartir con QR -->
    <div id="share-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay bg-black/70">
        <div class="modal-content glass-card w-full max-w-md p-8 relative">
            <button onclick="closeShareModal()" class="absolute top-4 right-4 w-8 h-8 flex items-center justify-center text-slate-400 hover:text-white transition-colors">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>
            <div class="text-center">
                <div class="w-16 h-16 mx-auto mb-4 bg-primary-500/10 rounded-full flex items-center justify-center">
                    <i data-lucide="share-2" class="w-8 h-8 text-primary-400"></i>
                </div>
                <h3 class="text-2xl font-bold text-white mb-2">Compartir Seguimiento</h3>
                <p class="text-slate-400 text-sm mb-6">Comparte el enlace o escanea el código QR</p>
                <div id="qrcode" class="flex justify-center mb-6 bg-white p-4 rounded-xl inline-block mx-auto"></div>
                <div class="flex gap-2 mb-4">
                    <input type="text" id="share-link" readonly class="flex-1 px-4 py-3 bg-slate-800 border border-slate-700 rounded-lg text-slate-300 text-sm focus:outline-none">
                    <button onclick="copyLink()" class="px-4 py-3 bg-primary-500 hover:bg-primary-400 text-white rounded-lg font-medium transition-all">
                        <i data-lucide="copy" class="w-5 h-5"></i>
                    </button>
                </div>
                <div class="flex gap-2 justify-center">
                    <button onclick="shareWhatsApp()" class="flex-1 px-4 py-2 bg-green-600 hover:bg-green-500 text-white rounded-lg font-medium transition-all flex items-center justify-center gap-2">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
                        WhatsApp
                    </button>
                    <button onclick="shareEmail()" class="flex-1 px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg font-medium transition-all flex items-center justify-center gap-2">
                        <i data-lucide="mail" class="w-5 h-5"></i>
                        Email
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal IA -->
    <div id="ai-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay bg-black/70">
        <div class="modal-content glass-card w-full max-w-2xl p-8 relative">
            <button onclick="closeAIModal()" class="absolute top-4 right-4 w-8 h-8 flex items-center justify-center text-slate-400 hover:text-white transition-colors">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>
            <div class="flex items-center gap-3 pb-4 border-b border-white/10 mb-6">
                <div class="w-10 h-10 bg-accent-500/20 rounded-full flex items-center justify-center ring-1 ring-accent-400/30">
                    <i data-lucide="sparkles" class="w-6 h-6 text-accent-300"></i>
                </div>
                <h2 class="text-xl font-bold text-white">Resumen Ejecutivo por IA</h2>
            </div>
            <div id="ai-modal-body" class="min-h-[150px] flex items-center justify-center text-slate-200"></div>
        </div>
    </div>

    <script>
        // =============================================
        // CONFIGURACIÓN - CAMBIAR DASHBOARD_URL EN PRODUCCIÓN
        // =============================================
        const DASHBOARD_URL = "https://hoymismodashboard.vercel.app"; // URL del dashboard en Vercel
        const API_URL = `${DASHBOARD_URL}/api/consultar-tramite`;
        const GEMINI_API_KEY = 'AIzaSyBS3psBaKY4ROVwxfzrcqP7Uv-LDEmccPA';

        let currentSearchMode = 'email';
        let currentTramiteData = null;

        // Configuración de estados del timeline
        const STATUS_CONFIG = {
            'Contacto Registrado': { icon: 'user-plus', label: 'Contacto', order: 0 },
            'En Revisión': { icon: 'file-search', label: 'Revisión', order: 1 },
            'Validación': { icon: 'shield-check', label: 'Validación', order: 2 },
            'En Proceso': { icon: 'cog', label: 'En Proceso', order: 3 },
            'Etapa Final': { icon: 'flag', label: 'Etapa Final', order: 4 },
            'Liberado': { icon: 'check-circle', label: 'Liberado', order: 5 },
            'Cancelado': { icon: 'x-circle', label: 'Cancelado', order: -1 },
        };
        const STATUS_ORDER = ['Contacto Registrado', 'En Revisión', 'Validación', 'En Proceso', 'Etapa Final', 'Liberado'];

        // =============================================
        // FUNCIONES DE UI
        // =============================================
        function setSearchMode(mode) {
            currentSearchMode = mode;
            const input = document.getElementById('search-input');
            const tabs = { email: 'tab-email', folio: 'tab-folio', vin: 'tab-vin' };
            const placeholders = {
                email: 'Ingresa tu correo electrónico...',
                folio: 'Ingresa tu número de folio (ej: USHO-1234)...',
                vin: 'Ingresa el VIN del vehículo (17 caracteres)...'
            };
            const icons = { email: 'mail', folio: 'file-text', vin: 'car' };

            // Actualizar tabs
            Object.entries(tabs).forEach(([key, id]) => {
                const btn = document.getElementById(id);
                if (key === mode) {
                    btn.classList.remove('bg-slate-700', 'text-slate-300');
                    btn.classList.add('bg-primary-500', 'text-white');
                } else {
                    btn.classList.remove('bg-primary-500', 'text-white');
                    btn.classList.add('bg-slate-700', 'text-slate-300');
                }
            });

            input.placeholder = placeholders[mode];
            input.value = '';
            document.getElementById('search-icon').setAttribute('data-lucide', icons[mode]);
            lucide.createIcons();
        }

        function resetUI() {
            document.getElementById('search-input').value = '';
            document.getElementById('status-container').innerHTML = '';
            document.getElementById('results-view').classList.add('hidden');
            document.getElementById('results-view').innerHTML = '';
            currentTramiteData = null;
        }

        function showLoading() {
            document.getElementById('status-container').innerHTML = `
                <div class="glass-card p-6 animate-pulse space-y-4">
                    <div class="h-8 bg-slate-700 rounded w-1/3"></div>
                    <div class="h-4 bg-slate-700 rounded w-2/3"></div>
                    <div class="h-4 bg-slate-700 rounded w-1/2"></div>
                </div>
            `;
            document.getElementById('results-view').classList.add('hidden');
        }

        function showMessage(type, message) {
            const colors = {
                error: 'border-red-500 text-red-300 bg-red-500/10',
                warning: 'border-amber-500 text-amber-300 bg-amber-500/10',
                info: 'border-blue-500 text-blue-300 bg-blue-500/10'
            };
            const icons = { error: 'alert-circle', warning: 'alert-triangle', info: 'info' };

            document.getElementById('status-container').innerHTML = `
                <div class="glass-card p-6 flex items-center gap-4 border-l-4 ${colors[type]}">
                    <i data-lucide="${icons[type]}" class="w-8 h-8"></i>
                    <span class="font-medium text-lg">${message}</span>
                </div>
            `;
            document.getElementById('results-view').classList.add('hidden');
            lucide.createIcons();
        }

        // =============================================
        // BÚSQUEDA Y RENDERIZADO
        // =============================================
        async function handleSearch() {
            const input = document.getElementById('search-input').value.trim();

            if (!input) {
                showMessage('warning', 'Por favor, ingresa un valor para buscar.');
                return;
            }

            // Validaciones básicas
            if (currentSearchMode === 'email' && !input.includes('@')) {
                showMessage('error', 'Por favor, ingresa un correo electrónico válido.');
                return;
            }
            if (currentSearchMode === 'vin' && input.length !== 17) {
                showMessage('error', 'El VIN debe tener exactamente 17 caracteres.');
                return;
            }

            showLoading();

            try {
                const params = new URLSearchParams({ [currentSearchMode]: input });
                const response = await fetch(`${API_URL}?${params}`);
                const data = await response.json();

                if (data.error) {
                    showMessage('warning', data.error);
                    return;
                }

                currentTramiteData = data;
                document.getElementById('status-container').innerHTML = '';
                renderResults(data);

            } catch (error) {
                console.error('Error:', error);
                showMessage('error', 'Error al conectar con el servidor. Por favor, intenta de nuevo.');
            }
        }

        function renderResults(data) {
            const resultsView = document.getElementById('results-view');
            const currentStatusIndex = STATUS_ORDER.indexOf(data.estatus_actual);
            const progress = currentStatusIndex >= 0 ? (currentStatusIndex / (STATUS_ORDER.length - 1)) * 100 : 0;

            // Timeline steps HTML
            const stepsHTML = STATUS_ORDER.map((statusKey, index) => {
                const config = STATUS_CONFIG[statusKey];
                let statusClass = '';
                if (index < currentStatusIndex) statusClass = 'completed';
                if (index === currentStatusIndex) statusClass = 'active';

                return `
                    <div class="timeline-step relative flex flex-col items-center z-10 ${statusClass}">
                        <div class="step-circle w-10 h-10 bg-slate-700/50 border-2 border-slate-600 rounded-full flex items-center justify-center transition-all duration-300">
                            <i data-lucide="${config.icon}" class="w-5 h-5 text-slate-400"></i>
                        </div>
                        <p class="mt-2 text-xs text-center text-slate-400 font-medium">${config.label}</p>
                    </div>
                `;
            }).join('');

            resultsView.innerHTML = `
                <!-- Encabezado de Estado -->
                <div class="glass-card p-6 md:p-8 fade-in-up relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-primary-500 to-accent-500"></div>

                    <button onclick="shareTracking()" class="absolute top-4 right-4 w-10 h-10 flex items-center justify-center bg-slate-800/80 hover:bg-slate-700 border border-slate-600 rounded-full text-slate-300 hover:text-primary-400 transition-all hover:scale-110">
                        <i data-lucide="share-2" class="w-5 h-5"></i>
                    </button>

                    <div class="flex flex-col md:flex-row items-start gap-6">
                        <div class="w-16 h-16 bg-primary-500/20 rounded-2xl flex items-center justify-center ring-2 ring-primary-500/30 flex-shrink-0">
                            <i data-lucide="${STATUS_CONFIG[data.estatus_actual]?.icon || 'help-circle'}" class="w-8 h-8 text-primary-300"></i>
                        </div>
                        <div class="flex-grow">
                            <p class="text-sm font-medium text-primary-400">Estado Actual</p>
                            <h2 class="text-3xl font-bold text-white mt-1">${data.estatus_actual}</h2>
                            <p class="text-slate-400 mt-1">Folio: <span class="font-mono text-white">${data.folio}</span></p>
                        </div>
                        <div class="w-full md:w-auto mt-4 md:mt-0">
                            <button onclick="generateAISummary()" class="w-full bg-gradient-to-r from-accent-500 to-primary-500 hover:from-accent-600 hover:to-primary-600 text-white font-semibold py-3 px-5 rounded-lg flex items-center justify-center gap-2 transition-all duration-200 text-sm shadow-lg shadow-accent-500/20">
                                <i data-lucide="sparkles" class="w-4 h-4"></i>
                                Generar Resumen con IA
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Timeline -->
                <div class="glass-card p-6 md:p-8 fade-in-up" style="animation-delay: 0.2s;">
                    <h3 class="text-xl font-bold text-white mb-8 text-center">Progreso del Trámite</h3>
                    <div class="relative">
                        <div class="timeline-track"></div>
                        <div class="timeline-progress" style="width: ${progress}%;"></div>
                        <div class="flex justify-between">${stepsHTML}</div>
                    </div>
                </div>

                <!-- Detalles del Trámite -->
                <div class="glass-card p-6 md:p-8 fade-in-up" style="animation-delay: 0.4s;">
                    <h3 class="text-xl font-bold text-white mb-6">Detalles del Trámite</h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <!-- Cliente -->
                        <div class="bg-white/5 p-4 rounded-lg">
                            <p class="text-sm font-semibold text-slate-400 mb-2 flex items-center gap-2">
                                <i data-lucide="user" class="w-4 h-4"></i> Cliente
                            </p>
                            <div class="space-y-2">
                                <div class="flex justify-between text-sm">
                                    <span class="text-slate-500">Nombre:</span>
                                    <span class="font-medium text-slate-200">${data.nombre || 'N/A'}</span>
                                </div>
                                <div class="flex justify-between text-sm">
                                    <span class="text-slate-500">Email:</span>
                                    <span class="font-medium text-slate-200 text-right">${data.email || 'N/A'}</span>
                                </div>
                            </div>
                        </div>

                        <!-- Vehículo -->
                        <div class="bg-white/5 p-4 rounded-lg">
                            <p class="text-sm font-semibold text-slate-400 mb-2 flex items-center gap-2">
                                <i data-lucide="car" class="w-4 h-4"></i> Vehículo
                            </p>
                            <div class="space-y-2">
                                <div class="flex justify-between text-sm">
                                    <span class="text-slate-500">Marca/Modelo:</span>
                                    <span class="font-medium text-slate-200">${data.marca} ${data.modelo}</span>
                                </div>
                                <div class="flex justify-between text-sm">
                                    <span class="text-slate-500">VIN:</span>
                                    <span class="font-mono text-xs text-slate-200">${data.vin || 'N/A'}</span>
                                </div>
                            </div>
                        </div>

                        <!-- Trámite -->
                        <div class="bg-white/5 p-4 rounded-lg">
                            <p class="text-sm font-semibold text-slate-400 mb-2 flex items-center gap-2">
                                <i data-lucide="file-text" class="w-4 h-4"></i> Trámite
                            </p>
                            <div class="space-y-2">
                                <div class="flex justify-between text-sm">
                                    <span class="text-slate-500">Pedimento:</span>
                                    <span class="font-medium text-slate-200">${data.tipo_pedimento?.split(' - ')[0] || 'N/A'}</span>
                                </div>
                                <div class="flex justify-between text-sm">
                                    <span class="text-slate-500">Inicio:</span>
                                    <span class="font-medium text-slate-200">${data.fecha_inicio || 'N/A'}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                ${data.historial && data.historial.length > 0 ? `
                <!-- Historial -->
                <div class="glass-card p-6 md:p-8 fade-in-up" style="animation-delay: 0.6s;">
                    <h3 class="text-xl font-bold text-white mb-6 flex items-center gap-2">
                        <i data-lucide="clock" class="w-5 h-5 text-primary-400"></i> Historial de Movimientos
                    </h3>
                    <div class="space-y-3">
                        ${data.historial.map((event, index) => {
                            const date = new Date(event.timestamp);
                            return `
                                <div class="flex gap-4 items-start ${index === 0 ? 'opacity-100' : 'opacity-75'}">
                                    <div class="flex flex-col items-center">
                                        <div class="w-3 h-3 rounded-full ${index === 0 ? 'bg-primary-500 ring-4 ring-primary-500/30' : 'bg-slate-600'} flex-shrink-0"></div>
                                        ${index < data.historial.length - 1 ? '<div class="w-0.5 h-full bg-slate-700 mt-1"></div>' : ''}
                                    </div>
                                    <div class="flex-1 pb-4">
                                        <div class="flex items-center gap-2 mb-1">
                                            <span class="text-sm font-semibold text-white">${event.status}</span>
                                            ${index === 0 ? '<span class="px-2 py-0.5 bg-primary-500/20 text-primary-400 text-[10px] font-bold rounded-full">RECIENTE</span>' : ''}
                                        </div>
                                        <div class="text-xs text-slate-500">
                                            ${date.toLocaleDateString('es-MX', { day: 'numeric', month: 'short', year: 'numeric' })} •
                                            ${date.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' })}
                                        </div>
                                        ${event.description ? `<div class="text-xs text-slate-400 mt-1">${event.description}</div>` : ''}
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
                ` : ''}
            `;

            resultsView.classList.remove('hidden');
            lucide.createIcons();
        }

        // =============================================
        // IA - GEMINI
        // =============================================
        async function generateAISummary() {
            if (!currentTramiteData) return;

            const modal = document.getElementById('ai-modal');
            const body = document.getElementById('ai-modal-body');

            modal.classList.remove('hidden');
            body.innerHTML = `
                <div class="flex flex-col items-center text-center">
                    <div class="gemini-spinner"></div>
                    <p class="mt-4 font-semibold text-slate-200">Analizando información...</p>
                    <p class="text-sm text-slate-400">Nuestra IA está generando un resumen personalizado.</p>
                </div>
            `;

            try {
                const data = currentTramiteData;
                const systemPrompt = "Eres un asistente experto de una agencia aduanal mexicana especializada en importación de vehículos. Tu tarea es generar un resumen ejecutivo claro, conciso y amigable para un cliente sobre el estado de su trámite de importación vehicular. Traduce la jerga técnica aduanal a un lenguaje fácil de entender. Sé profesional y tranquilizador. El resumen debe estar en español y formateado en 2-3 párrafos cortos.";

                const userQuery = `
                    Genera un resumen ejecutivo para el cliente ${data.nombre} sobre su trámite de importación con folio ${data.folio}.
                    Detalles:
                    - Vehículo: ${data.marca} ${data.modelo}
                    - VIN: ${data.vin}
                    - Tipo de Pedimento: ${data.tipo_pedimento}
                    - Estado Actual: ${data.estatus_actual}
                    - Fecha de Inicio: ${data.fecha_inicio}

                    Basado en el estatus actual, explica brevemente:
                    1. Qué significa este estado en términos simples
                    2. Qué pasos se han completado
                    3. Cuáles son los siguientes pasos esperados

                    Finaliza con un mensaje positivo y profesional.
                `;

                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key=${GEMINI_API_KEY}`;

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: userQuery }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] },
                    })
                });

                if (!response.ok) throw new Error('API Error');

                const result = await response.json();
                const text = result.candidates?.[0]?.content?.parts?.[0]?.text || 'No se pudo generar el resumen.';

                body.innerHTML = `
                    <div class="prose prose-invert max-w-none text-left">
                        <div class="text-slate-200 leading-relaxed">${text.replace(/\n/g, '<br>')}</div>
                    </div>
                `;

            } catch (error) {
                console.error('AI Error:', error);
                body.innerHTML = `
                    <div class="text-center text-slate-400">
                        <i data-lucide="alert-circle" class="w-12 h-12 mx-auto mb-4 text-red-400"></i>
                        <p>Lo sentimos, no pudimos generar el resumen en este momento.</p>
                        <p class="text-sm mt-2">Por favor, intenta de nuevo más tarde.</p>
                    </div>
                `;
                lucide.createIcons();
            }
        }

        function closeAIModal() {
            document.getElementById('ai-modal').classList.add('hidden');
        }

        // =============================================
        // COMPARTIR
        // =============================================
        function shareTracking() {
            if (!currentTramiteData) return;

            const modal = document.getElementById('share-modal');
            const qrcodeDiv = document.getElementById('qrcode');
            const shareLink = document.getElementById('share-link');

            const trackingUrl = `${window.location.origin}${window.location.pathname}?folio=${currentTramiteData.folio}`;
            shareLink.value = trackingUrl;

            qrcodeDiv.innerHTML = '';
            new QRCode(qrcodeDiv, {
                text: trackingUrl,
                width: 180,
                height: 180,
                colorDark: '#0f172a',
                colorLight: '#ffffff',
                correctLevel: QRCode.CorrectLevel.H
            });

            modal.classList.remove('hidden');
            lucide.createIcons();
        }

        function closeShareModal() {
            document.getElementById('share-modal').classList.add('hidden');
        }

        function copyLink() {
            const shareLink = document.getElementById('share-link');
            shareLink.select();
            document.execCommand('copy');
            alert('Enlace copiado al portapapeles');
        }

        function shareWhatsApp() {
            const url = document.getElementById('share-link').value;
            const message = `Hola! Te comparto el seguimiento de mi trámite de importación en Agencia Aduanal HoyMismo: ${url}`;
            window.open(`https://wa.me/?text=${encodeURIComponent(message)}`, '_blank');
        }

        function shareEmail() {
            const url = document.getElementById('share-link').value;
            const subject = 'Seguimiento de Trámite - Agencia Aduanal HoyMismo';
            const body = `Hola,\n\nTe comparto el enlace para dar seguimiento a mi trámite de importación:\n\n${url}\n\nSaludos!`;
            window.location.href = `mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
        }

        // =============================================
        // INICIALIZACIÓN
        // =============================================
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();

            // Auto-cargar si hay parámetros en la URL
            const urlParams = new URLSearchParams(window.location.search);
            const folio = urlParams.get('folio');
            const email = urlParams.get('email');
            const vin = urlParams.get('vin');

            if (folio) {
                setSearchMode('folio');
                document.getElementById('search-input').value = folio;
                handleSearch();
            } else if (email) {
                setSearchMode('email');
                document.getElementById('search-input').value = email;
                handleSearch();
            } else if (vin) {
                setSearchMode('vin');
                document.getElementById('search-input').value = vin;
                handleSearch();
            }

            // Enter para buscar
            document.getElementById('search-input').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleSearch();
            });
        });
    </script>
</body>
</html>
